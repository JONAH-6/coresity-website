# Included in every location that sets headers: nginx does not inherit
# add_header into a block that has its own add_header.
#
# CSP notes:
# - Redwood injects the bundle as an external <script type="module" src>,
#   so scripts stay 'self' only.
# - NotFoundPage and FatalErrorPage render inline <style> elements, so
#   styles need 'unsafe-inline'.
# - web/src/index.css imports Google Fonts.
# HSTS is set by Traefik, where TLS ends.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
