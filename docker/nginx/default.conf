# Serves the Redwood web build (web/dist).
# The routing mirrors Redwood's own web server (@redwoodjs/fastify-web):
# real files are served as-is and every other path falls back to 200.html,
# so the client-side router handles it (including the NotFoundPage).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite's hashed build output: the file name changes with the content.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Everything else, including unhashed public files (icons, logos), is
    # revalidated on each request.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /200.html;
    }
}
